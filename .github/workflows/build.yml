name: Build Flesh Render

on:
  push:
    tags:
      - 'flesh-render-v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == flesh-render-v* ]]; then v="${ref#flesh-render-v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\windows\flesh-render.iss'

      - name: Zip VST3 (manual-copy option)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/FleshRender_artefacts/Release/VST3/Flesh Render.vst3" -DestinationPath "dist/FleshRender-${{ steps.ver.outputs.version }}-Windows-VST3.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == flesh-render-v* ]]; then v="${ref#flesh-render-v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer (.pkg)
        run: |
          chmod +x packaging/macos/build_installer.sh
          VERSION="${{ steps.ver.outputs.version }}" packaging/macos/build_installer.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/flesh-render-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
